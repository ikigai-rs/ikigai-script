[package]
name = "ikigai-script"
version = "0.3.1"
edition = "2021"
# The toolchain the shared CI's msrv job builds and tests on. Nothing in this crate needs
# more than edition 2021; 1.89 is the line the ecosystem's other declared crates
# (ikigai-log, ikigai-cms-web) already hold, and it is MEASURED here rather than assumed:
# `cargo +1.89 clippy --all-targets` and `cargo +1.89 test` pass over this crate and its
# dev-dependencies (Steel included) before the first push.
rust-version = "1.89"
# MSRV-aware resolution (cargo's resolver 3): choose, from each dependency's compatible
# range, the newest version that still builds on `rust-version`. Without it a fresh resolve
# (CI commits no lockfile) takes `ordered-float` 5.5, which needs 1.90, through the Steel
# dev-dependency alone, and the msrv job fails on a graph no consumer of this LIBRARY
# ever builds. The library's own graph is unaffected either way.
resolver = "3"
license = "MIT OR Apache-2.0"
description = "Scripts (Lisp; SPARQL queries with typed parameters and authority derived from the graphs they name; or plans, validated before they are stored, with authority derived from their steps) as resources in any ikigai host: `urn:script:{name}` is an atom with content-addressed versions, a compiled form, a result you read and runs you record, run under the least of what the script declares, what its publisher held at publish time, the host's ceiling and the runner's own capability. A host library: no binary, no elevation."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-script"
homepage = "https://github.com/ikigai-rs/ikigai-script"
readme = "README.md"
keywords = ["ikigai", "roc", "scripting", "capability", "module"]
categories = ["development-tools"]

[dependencies]
# The published kernel, the SAME one the hosts link, so a host carries exactly one
# `ikigai-core`. **0.1.86 is the LIBRARY's true minimum, and it is a SECURITY floor, not
# an API one**: it is where exclusions became sticky under `Capability::attenuate` (ledger #858)
# and `is_deny_scope` arrived. A run carries its publisher's exclusions by REQUESTING
# them in the attenuation; before 0.1.86 attenuate kept only what the runner held, so a
# publisher's `urn:cap:fs:read:-/root/secret` would have been silently dropped and the
# script could read what its publisher could not. MEASURED: a scratch crate pinning
# `=0.1.80` fails to compile (no `is_deny_scope`), `=0.1.86` compiles. The rest is older:
# `Error::Conflict` (0.1.80), `Invocation::issue_attenuated` (0.1.75).
# **0.1.89 since conformance 0.6.0**, a TESTED floor rather than an API one: the library
# still compiles against 0.1.86, but the conformance dev-dependency needs 0.1.89
# (`space_iri`, `SPACE_PREFIX`), so no test of this crate can run on anything older, and a
# floor nothing tests is not a floor this crate can vouch for.
# **0.1.93 since ledger #1077 and #1079**, an API floor again: who a request is for is read
# from the capability (`Capability::principal`, `acts_as`, the `urn:cap:principal:` scope a
# door mints with `with_principal`), which replaced this crate's own principal stamper, and a
# version's NotFound hangs from its script's thread through `Invocation::depends_on`, which
# 0.1.93 is the first to carry on a failure. Both arrived in 0.1.93.
# **0.1.95 since ledger #1105**, a BEHAVIOR floor: the kernel cuts a Sink's target when the
# endpoint ran and then failed, so a FAILED run (recorded all the same) cuts
# `urn:script:{name}:runs` and a cached fallback over its record. Before 0.1.95 only a
# successful run cut it. The API is unchanged; `tests/lifecycle.rs` pins the behavior.
# ⚠ `"0.1.95"` is a RANGE, `>=0.1.95, <0.2.0`: when core reaches 0.2 this line must move
# or the crate freezes out of it.
ikigai-core = "0.1.95"
# `Endpoint::invoke` is `async_trait`, and these endpoints carry state (the backend and the
# host's ceiling), so they are `Endpoint` impls, not closures.
async-trait = "0.1"
# Every record this crate keeps (a head, a version, a run) and its machine face are JSON:
# one serializer for the disk and the wire, so the two cannot drift.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A version's name is its content: `sha256:` + hex, the TAGGED digest convention
# ikigai-sign set and ikigai-log and ikigai-ledger took (ecosystem decision: tag, do not
# multihash), so a version digest joins theirs in a query instead of colliding.
# 0.11 matches what a fresh resolve gives spareval (oxigraph's evaluator, reached here through
# the ikigai-store dev-dependency), so the graph carries one sha2; its MSRV is 1.85. ⚠ It is NOT
# a defense of spareval: spareval takes md-5, sha1 and sha2 as independent `>=0.10,<0.12`
# edges, and a direct dependency never constrains another crate's edge. The break seen here was
# a LOCAL lock (this repo's lock is gitignored, so CI always resolves fresh and never mixes)
# holding sha2 0.10 while an incremental resolve took md-5/sha1 0.11 for spareval. The fix for
# that is `cargo update -p sha2@<the stale 0.10.x>` (never --precise); ikigai-devtools' `just
# lock-lint` checks committed locks for it daily (ledger #1148, #1195).
sha2 = "0.11"
# SPARQL scripts are PARSED here, never evaluated: the form, the declared parameters, the
# graphs a query names (its derived authority) and the substitution of parameter values all
# happen on spargebra's algebra, and what the store is sent is what spargebra serializes from
# it. 0.4.7 is the parser oxigraph 0.5.11 uses, so the text this crate writes and the text the
# store reads go through the same grammar; it is also the version tested here.
# ⚠ `"0.4.7"` is `<0.5.0`: move it when oxigraph moves to spargebra 0.5.
# ⚠ Feature unification: a host enabling `sparql-12` or `sep-0006` (oxigraph's `rdf-12`)
# adds enum variants, so every match on the algebra keeps a refusing wildcard arm.
spargebra = "0.4.7"
# A typed parameter's value is checked against its XSD datatype and bound in its canonical
# form. The same crate oxrdf and the store use for those types. ⚠ `"0.2.3"` is `<0.3.0`.
oxsdatatypes = "0.2.3"
# A plan script (`language=plan`) is Turtle, read SHALLOWLY here for the three things this
# crate decides itself: the process node, every step's verb (read or write) and the declared
# parameters (the arguments of the script's own catalog entry). Validation, the derived
# authority and running are the host's plan doors, reached by sub-request. 0.2.4 and 0.3.4
# are the parser and model oxigraph 0.5.11 uses, and the oxrdf spargebra 0.4.7 pins
# (`=0.3.4`), so the graph carries one of each; both keep an explicit parse stack, so a
# deeply nested plan is not a claim on the thread's stack.
# ⚠ `"0.2.4"` is `<0.3.0` and `"0.3.4"` is `<0.4.0`: move them with spargebra.
oxttl = "0.2.4"
oxrdf = "0.3.4"

[dev-dependencies]
futures = "0.3"
# The module recipe as one test. 0.6.0 is the CURRENT published definition of "done":
# SPACE-NAME (ledger #987), whose `host_named_space` declaration `tests/conformance.rs`
# makes for `space(config)`. It needs core 0.1.89, which is why the core pin above is there.
# ⚠ `"0.6.0"` is `<0.7.0`: raise it when conformance moves (0.6.1 is merged upstream, not
# yet published), or this crate keeps reporting green against an old rulebook.
ikigai-conformance = "0.6.0"
# The evaluator, through the kernel, as a host would mount it. The LIBRARY never links
# Steel: a script reaches `urn:lisp:eval` as a sub-request, so the language is a resource.
# 0.1.15 is the published line; 0.2.0 (the allowlist sandbox, ledger #903) is merged but
# not published, and moving to it changes nothing here but this pin (see README, "Lisp").
ikigai-lisp = "0.1.15"
# `TurtleRenderer` gives the test kernels a JSON Meta face. ⚠ Without one the engine's
# pipe routing cannot be observed (it fails open onto an input named `in`), and the
# conformance walk needs it, so every test kernel is `Kernel::with_meta_renderer`.
# 0.1.47 is where the JSON Meta face arrives.
ikigai-vocab = "0.1.47"
# The store a SPARQL script runs against in the tests, in memory, bound exactly as a host binds
# it: every run is a sub-request to its graph-scoped doors. 0.2.7 is where caller SPARQL is
# bounded before the parser sees it (ledger #915), the behavior `src/limits.rs` copies.
# **0.2.10 since ledger #1085**: where every store door refuses SERVICE and LOAD in every build
# (ledger #1083), and where the `http-client` feature `http-client-probe` below turns on exists.
# The library still never links the store: this crate parses SPARQL and refuses SERVICE and LOAD
# itself, and the store's refusal is the second layer, which the egress test pins too.
# ⚠ `"0.2.10"` is `>=0.2.10, <0.3.0`.
ikigai-store = "0.2.10"
# The module a plan's steps read in `tests/root_plan.rs` (ledger #1220): a plan whose one step
# is `Source urn:iki:ledger:{L}:next` or `…:items`, run under gonk's script ceiling copied
# verbatim. Its reads DECLARE families (`urn:cap:ledger:read:*`, `urn:cap:store:read:graph:*`)
# and CHECK exact per-ledger tokens inside, which is the case a run's derived authority has
# to meet. 0.8.0 is the published line (0.9.0 adds `count` and changes nothing these reads
# declare). The library never links it. ⚠ `"0.8.0"` is `<0.9.0`.
ikigai-ledger = "0.8.0"
# Only for the egress test's CONTROL (`tests/sparql_service_egress.rs`): oxigraph's own
# evaluator, with no ikigai layer, really does reach a local stub in the probe build, so "the
# stub saw nothing" is not vacuous. No default features: the probe feature adds the client.
# 0.5.11 is what ikigai-store 0.2.10 resolves to and the oxigraph spargebra 0.4.7 belongs to.
# ⚠ `"0.5.11"` is `<0.6.0`: move it with spargebra.
oxigraph = { version = "0.5.11", default-features = false }

[features]
# TEST-ONLY. Compiles oxigraph's HTTP client into the test build, which is what a host gets when
# some other crate in its graph enables `oxigraph/http-client` (rudof_rdf does, through
# ikigai-shacl, so ikigai-cli has it; ledger #1083). `tests/sparql_service_egress.rs` runs under
# it in CI's `features:` job and proves a SERVICE or LOAD script still reaches no network.
# It names a DEV-dependency's feature, so turning it on changes nothing a consumer of this
# library links: the library has no HTTP client and no evaluator, with or without it.
http-client-probe = ["ikigai-store/http-client", "oxigraph/http-client"]

# Every Lisp evaluation builds its own Steel engine, and an unoptimized Steel takes about
# a second to build one where an optimized one takes ~60 ms (ikigai-lisp measured it).
# Optimize Steel alone in the dev/test profile so the suite measures this crate, not
# Steel's debug build. A profile applies only to this workspace's own builds.
[profile.dev.package.steel-core]
opt-level = 3
